<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Video Frame Extractor</title></head>
<body>
<video id="v" src="/nguvan.mp4" muted playsinline preload="auto" style="display:none;"></video>
<canvas id="c" width="1920" height="1080" style="display:none;"></canvas>
<script>
window.__ready = false;
const v = document.getElementById('v');
const c = document.getElementById('c');
const ctx = c.getContext('2d');

v.onloadedmetadata = () => {
  c.width = v.videoWidth || 1920;
  c.height = v.videoHeight || 1080;
  window.__ready = true;
};

window.captureFrame = (timeInSec) => {
  return new Promise((resolve, reject) => {
    v.currentTime = timeInSec;
    v.onseeked = () => {
      ctx.drawImage(v, 0, 0, c.width, c.height);
      resolve(c.toDataURL('image/png', 0.95));
    };
    v.onerror = (e) => reject(e);
  });
};
</script>
</body>
</html>
